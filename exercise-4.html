<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Form + Video </title>
</head>
<body>
  <h1>HTML Practice: Form and Video</h1>
  <h2>1. Video Element</h2>
  <!-- Video: width bumped from 560 to 640, height="315" added, and autoplay/loop/muted turned on for hands-free playback -->
  <video controls width="640" height="315" autoplay loop muted>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg">
    Your browser does not support the video tag.
  </video>
  <p>This is a sample video. Try the play button, volume slider, and fullscreen.</p>
  <hr>
  <h2>2. Contact Form</h2>
  <form action="#" method="post">
    <!-- Name: plain text input with a placeholder hint -->
    <p>
      <label for="fullname">Your name:</label><br>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your name">
    </p>
    <!-- Email: type="email" gives built-in format validation, required blocks empty submit -->
    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </p>
    <!-- Country: dropdown with a blank default option so nothing is pre-selected -->
    <p>
      <label for="country">Where are you from?</label><br>
      <select id="country" name="country">
        <option value="">-- please choose --</option>
        <option value="usa">United States</option>
        <option value="canada">Canada</option>
        <option value="uk">United Kingdom</option>
        <option value="other">Other</option>
      </select>
    </p>
    <!-- Referral source: radio group, shared name="found" means only one can be picked -->
    <p>
      How did you find this page?<br>
      <input type="radio" id="google" name="found" value="google">
      <label for="google">Google</label><br>
      <input type="radio" id="friend" name="found" value="friend">
      <label for="friend">A friend told me</label><br>
      <input type="radio" id="other" name="found" value="other">
      <label for="other">Other</label>
    </p>
    <p>
      <label for="message">Your message:</label><br>
      <!-- Message textarea: enlarged from rows="5" cols="50" to rows="8" cols="60" -->
      <textarea id="message" name="message" rows="8" cols="60" placeholder="Write something here..."></textarea>
    </p>
    <!-- Newsletter: optional checkbox, unchecked by default -->
    <p>
      <input type="checkbox" id="newsletter" name="newsletter" value="yes">
      <label for="newsletter">Send me updates (totally optional)</label>
    </p>
    <p>
      <label for="birthday">Your birthday:</label><br>
      <!-- Birthday: new date input field added to the form -->
      <input type="date" id="birthday" name="birthday">
    </p>
    <!-- Buttons: submit sends the form, reset clears every field back to default -->
    <p>
      <button type="submit">Send</button>
      <button type="reset">Clear form</button>
    </p>
  </form>
</body>
</html>
