<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS Navbar Challenge</title>
<style>
.navbar {
  background-color: dimgray;
  overflow: hidden; /* without this the bar collapses since the links float */
}

.navbar a {
  float: left; /* lines the links up side by side */
  color: white;
  padding: 14px 16px;
  text-decoration: none; /* no underline */
}

.navbar a:hover {
  background-color: #04AA6D; /* green on hover */
}
</style>
</head>
<body>

<div class="navbar">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</div>

<h2>Welcome</h2>
<p>This is a horizontal navigation bar.</p>

</body>
</html>
